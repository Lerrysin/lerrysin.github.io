{% include base_path %}

<!-- start custom head snippets -->

<!-- Support for Academicons -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<!-- favicon from https://commons.wikimedia.org/wiki/File:OOjs_UI_icon_academic-progressive.svg -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="icon" href="/images/favicon.ico"/>
<meta name="theme-color" content="#ffffff"/>

<style>
  .page__footer { display: none; }
  body { padding-bottom: 2em; }
</style>

{% include language-context.html %}
{% if english_path and chinese_path %}
<link rel="alternate" hreflang="en" href="{{ english_path | absolute_url }}" />
<link rel="alternate" hreflang="zh-CN" href="{{ chinese_path | absolute_url }}" />
<link rel="alternate" hreflang="x-default" href="{{ english_path | absolute_url }}" />
{% endif %}
<script defer src="{{ '/assets/js/language-switch.js' | relative_url }}"></script>
<style>
  .greedy-nav .masthead__controls > div { display: flex; align-items: center; }
  .greedy-nav .language-switch { font-size: 0.8em; white-space: nowrap; border: 1px solid var(--global-border-color); border-radius: 5px; padding: 0.2rem 0.5rem; }
  .greedy-nav #theme-toggle { width: 25px; display: flex; justify-content: center; cursor: pointer; }
  .publication__translation { color: var(--global-text-color-light); font-size: 0.9em; margin: 0 0 0.5em; }
  html[lang="zh-CN"] body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
  html[lang="zh-CN"] .author__urls-wrapper button { white-space: nowrap; min-width: 4.5em; }
</style>
<!-- end custom head snippets -->
